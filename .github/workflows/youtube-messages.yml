name: Atualizar mensagem em destaque
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: youtube-featured
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        if: env.YOUTUBE_API_KEY != ''
      - name: Consultar o canal oficial
        if: env.YOUTUBE_API_KEY != ''
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          from pathlib import Path
          params = {
              'part': 'snippet,status', 'playlistId': 'UUeK9EVzNsmiD2PLTMIe_t_w',
              'maxResults': 50, 'key': os.environ['YOUTUBE_API_KEY'],
          }
          catalog = {}
          try:
              while True:
                  url = 'https://www.googleapis.com/youtube/v3/playlistItems?' + urllib.parse.urlencode(params)
                  with urllib.request.urlopen(url, timeout=20) as response:
                      page = json.load(response)
                  for item in page['items']:
                      if item.get('status', {}).get('privacyStatus') == 'public':
                          video = item['snippet']
                          id = video['resourceId']['videoId']
                          catalog[id] = {'id': id, 'title': video['title'], 'description': video['description']}
                  token = page.get('nextPageToken')
                  if not token:
                      break
                  params['pageToken'] = token
          except Exception:
              raise SystemExit('A consulta ao YouTube falhou. Confira a API e a credencial.')
          if catalog:
              Path('youtube-catalog.json').write_text(json.dumps(list(catalog.values()), ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Publicar atualização
        if: env.YOUTUBE_API_KEY != ''
        run: |
          git add youtube-catalog.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Update featured YouTube message"
          git push

name: Atualizar vídeos do canal
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: youtube-catalog
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Consultar vídeos públicos do canal
        run: python3 scripts/sync-youtube.py
      - name: Publicar catálogo atualizado
        run: |
          git add youtube-catalog.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Atualizar catálogo de vídeos do YouTube"
          git push
